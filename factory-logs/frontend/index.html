<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Event Log System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🏭 Factory Event Log System</h1>
            <p class="subtitle">Track incidents, maintenance, and safety events</p>
        </header>

        <!-- Dashboard Statistics -->
        <section class="dashboard" id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card stat-incidents">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-incidents">0</div>
                        <div class="stat-label">Incidents</div>
                    </div>
                </div>
                <div class="stat-card stat-maintenance">
                    <div class="stat-icon">🔧</div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-maintenance">0</div>
                        <div class="stat-label">Maintenance</div>
                    </div>
                </div>
                <div class="stat-card stat-safety">
                    <div class="stat-icon">🛡️</div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-safety">0</div>
                        <div class="stat-label">Safety Events</div>
                    </div>
                </div>
                <div class="stat-card stat-critical">
                    <div class="stat-icon">🚨</div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-critical">0</div>
                        <div class="stat-label">Critical Open</div>
                    </div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-detail">
                    <h3>By Severity</h3>
                    <div class="severity-bars" id="severity-stats"></div>
                </div>
                <div class="stat-detail">
                    <h3>By Status</h3>
                    <div class="status-bars" id="status-stats"></div>
                </div>
            </div>
        </section>

        <!-- Action Bar -->
        <section class="action-bar">
            <button class="btn btn-primary" onclick="showNewEventForm()">+ New Event</button>
            <div class="filters">
                <select id="filter-type" onchange="applyFilters()">
                    <option value="">All Types</option>
                    <option value="incident">Incidents</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="safety">Safety</option>
                </select>
                <select id="filter-severity" onchange="applyFilters()">
                    <option value="">All Severities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
                <select id="filter-status" onchange="applyFilters()">
                    <option value="">All Statuses</option>
                    <option value="open">Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="closed">Closed</option>
                </select>
                <input type="search" id="search-input" placeholder="Search events..." oninput="applyFilters()">
            </div>
        </section>

        <!-- Events List -->
        <section class="events-section">
            <h2>Events Log</h2>
            <div class="events-list" id="events-list">
                <div class="loading">Loading events...</div>
            </div>
        </section>

        <!-- New Event Modal -->
        <div class="modal" id="new-event-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create New Event</h2>
                    <button class="modal-close" onclick="closeNewEventForm()">&times;</button>
                </div>
                <form id="new-event-form" onsubmit="submitNewEvent(event)">
                    <div class="form-group">
                        <label for="event-type">Type *</label>
                        <select id="event-type" required>
                            <option value="">Select type</option>
                            <option value="incident">Incident</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="safety">Safety</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="event-title">Title *</label>
                        <input type="text" id="event-title" required placeholder="Brief description of the event">
                    </div>
                    <div class="form-group">
                        <label for="event-severity">Severity *</label>
                        <select id="event-severity" required>
                            <option value="">Select severity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="event-location">Location *</label>
                        <input type="text" id="event-location" required placeholder="e.g., Production Line 3">
                    </div>
                    <div class="form-group">
                        <label for="event-reporter">Reporter Name *</label>
                        <input type="text" id="event-reporter" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label for="event-description">Description *</label>
                        <textarea id="event-description" required rows="5" placeholder="Detailed description of the event..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeNewEventForm()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Event Detail Modal -->
        <div class="modal" id="event-detail-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Event Details</h2>
                    <button class="modal-close" onclick="closeEventDetail()">&times;</button>
                </div>
                <div id="event-detail-content"></div>
            </div>
        </div>

        <!-- Update Status Modal -->
        <div class="modal" id="update-status-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Update Event Status</h2>
                    <button class="modal-close" onclick="closeUpdateStatus()">&times;</button>
                </div>
                <form id="update-status-form" onsubmit="submitStatusUpdate(event)">
                    <input type="hidden" id="update-event-id">
                    <div class="form-group">
                        <label for="update-status">Status *</label>
                        <select id="update-status" required>
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="update-resolution">Resolution Notes</label>
                        <textarea id="update-resolution" rows="4" placeholder="Describe the resolution or current status..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeUpdateStatus()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update Status</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
